[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auravlian"
version = "0.8.0"
description = "Feel Beyond Sound. An offline-first Windows music player."
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.3", "mutagen==1.47.0", "numpy==2.2.6"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0", "ruff==0.11.13", "mypy==1.15.0"]
build = ["pyinstaller==6.11.1", "pyinstaller-hooks-contrib==2026.8"]

[project.scripts]
auravlian = "auravlian.app.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auravlian = ["presentation/theme/*.qss", "assets/logo/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true

